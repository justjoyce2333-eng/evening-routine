form .primary { width: 100%; padding: 13px; }

</style></head><body><header><div class="nav"><b class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 3v18M11 8h5M11 12h5M11 16h3"/></svg></span>日账</b><span class="divider"></span><select id="book" aria-label="选择账本"><option value="demo">示例账本</option><option value="mine">我的账本</option></select><button id="account" class="account-button">登录同步</button><button id="add" class="primary"><strong>＋</strong> 记一笔</button></div></header><main><div class="intro"><blockquote class="quote">“一粥一饭，当思来处不易。”</blockquote><div class="syncbar"><button id="import-local" hidden></button><span id="sync-status" role="status">本机保存</span></div></div><div class="layout"><section class="calendar"><div class="monthbar"><h2 id="month"></h2><div class="controls"><button id="prev" aria-label="上个月">‹</button><button id="today">今天</button><button id="next" aria-label="下个月">›</button></div></div><div class="week"></div><div id="grid"></div><footer><div><small>本月支出</small><b id="total"></b></div><div><small>日均支出</small><b id="avg"></b></div><div class="spark" aria-hidden="true"></div></footer></section><aside><div class="eyebrow"><i></i> 当日明细</div><div class="datehead"><h2 id="date"></h2><small id="weekday"></small></div><div class="sum"><small>当日支出</small><b id="daytotal"></b></div><div class="listhead">支出记录 <span id="count"></span></div><div id="records"></div><button class="primary" id="addday">＋ 添加支出</button></aside></div></main><dialog><form><div class="dialoghead"><h2>记一笔</h2><button type="button" id="close" aria-label="关闭">×</button></div><label>日期<input name="date" type="date" required></label><label>金额（元）<input name="amount" type="number" step=".01" min=".01" max="99999999" required></label><label>项目<input name="name" maxlength="40" required></label><fieldset class="categories"><legend>分类</legend><div id="categories"></div></fieldset><button class="primary">保存</button><small id="error" role="alert"></small></form></dialog><dialog id="account-dialog"><div class="dialoghead"><h2>云端账本</h2><button type="button" id="account-close" aria-label="关闭">×</button></div><form id="login-form"><label>邮箱<input name="email" type="email" autocomplete="email" required></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary" type="submit">登录</button><div class="auth-actions"><button id="signup" type="button">首次使用，注册账号</button><button id="reset-password" type="button">忘记密码</button></div></form><div id="signed-in" hidden><p id="account-email"></p><button id="logout" class="another">退出登录</button></div><form id="new-password" hidden><label>新密码<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary">更新密码</button></form><p id="account-message" role="status"></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js" crossorigin="anonymous" integrity="sha384-qmLe2vls59SnfpN2OJ/tjAASSNP+R7nmj+MyytoaCmVRjJbVGsUaFkxJW4jGpaqh"></script><script>const $=s=>document.querySelector(s);

 const rows=[],names=['午餐','拿铁咖啡','地铁通勤','生活用品','日常支出'];

}
$('#account').onclick = showAccount;
$('#account-close').onclick = () => accountDialog.close();

function describeError(error) {
 if (error?.message?.includes('ENTRY_CONFLICT')) return '这笔记录已在另一台电脑修改。请关闭窗口后重新打开最新记录。';
 if (error?.message?.includes('Invalid login credentials')) return '邮箱或密码不正确';
 if (error?.message?.includes('Email not confirmed')) return '请先到邮箱确认注册，再回来登录';
 if (error?.status === 429 || /rate.limit/i.test(error?.message || '')) return '操作频繁，请稍后再试';
 if (/password/i.test(error?.message || '')) return '密码至少需要 8 位，请重新输入';
 return '连接失败，请检查网络后重试';
}
function fromCloud(row) {
 return {id: row.id, date: row.date, name: row.name, amount: Number(row.amount),
  c: row.category, revision: row.revision};
}
function updateImportButton() {
 const cloudIds = new Set(cloudRows.map(row => row.id));
 const pending = data.mine.filter(row => !cloudIds.has(row.id));
 $('#import-local').hidden = !cloudUser || !cloudReady || pending.length === 0;
 $('#import-local').textContent = '导入本机 ' + pending.length + ' 笔账目';
}
function updateAccount() {
 $('#account').textContent = cloudUser ? '账户' : '登录同步';
 $('#signed-in').hidden = !cloudUser;
 loginForm.hidden = !!cloudUser;
 $('#account-email').textContent = cloudUser?.email || '';
 updateImportButton();
}
async function refreshCloud() {
 if (!cloudUser || refreshing || cloudSaving || dialog.open) return;
 const account = cloudUser.id;
 const sequence = refreshSequence;
 refreshing = true;
 try {
  const rows = [];
  for (let offset = 0; ; offset += 1000) {
   const {data: page, error} = await cloud.from('ledger_entries')
    .select('id,date,name,amount,category,revision').order('id').range(offset, offset + 999);
   if (error) throw error;
   rows.push(...page);
   if (page.length < 1000) break;
  }
  if (account !== cloudUser?.id || sequence !== refreshSequence) return;
  cloudRows = rows.map(fromCloud);
  cloudReady = true;
  $('#sync-status').textContent = '已同步';
  updateImportButton();
  render();
 } catch {
  if (account === cloudUser?.id) $('#sync-status').textContent = '云端连接失败 · 正在自动重试';
 } finally {
  refreshing = false;
 }
}
function setAccount(user) {
 if (user?.id === cloudUser?.id) return;
 refreshSequence++;
 cloudUser = user;
 cloudRows = [];
 cloudReady = false;
 dialog.close();
 $('#sync-status').textContent = user ? '正在同步…' : '本机保存';
 if (user) {book = 'mine'; selected = new Date();}
 updateAccount();
 render();
 void refreshCloud();
}
async function saveCloudEntry(entry, previous) {
 if (cloudSaving) return;
 const account = cloudUser.id;
 const payload = JSON.stringify(entry);
 // Preserve the request identifier when retrying an uncertain network response.
 if (!pendingMutation || pendingMutation.payload !== payload) {
  pendingMutation = {payload, id: crypto.randomUUID()};
 }
 cloudSaving = true;
 refreshSequence++;
 const saveButton = form.querySelector('.primary');
 saveButton.disabled = true;
 $('#close').disabled = true;
 $('#error').textContent = '';
 $('#sync-status').textContent = '正在保存…';
 try {
  const {data: result, error} = await cloud.rpc('save_ledger_entry', {
   entry_id: entry.id, entry_date: entry.date, entry_name: entry.name,
   entry_amount: entry.amount, entry_category: entry.c,
   expected_revision: previous?.revision || 0, mutation: pendingMutation.id
  });
  if (error) throw error;
  if (account !== cloudUser?.id) return;
  const saved = fromCloud(result);
  cloudRows = cloudRows.filter(row => row.id !== saved.id).concat(saved);
  selected = parse(saved.date);
  dialog.close();
  $('#sync-status').textContent = '已同步';
  render();
 } catch (error) {
  $('#error').textContent = describeError(error);
  $('#sync-status').textContent = '尚未保存 · 请重试';
  if (error?.message?.includes('ENTRY_CONFLICT')) {
   const {data: latest} = await cloud.from('ledger_entries')
    .select('id,date,name,amount,category,revision').eq('id', entry.id).maybeSingle();
   if (latest && account === cloudUser?.id) {
    cloudRows = cloudRows.filter(row => row.id !== latest.id).concat(fromCloud(latest));
    render();
   }
  }
 } finally {
  cloudSaving = false;
  saveButton.disabled = false;
  $('#close').disabled = false;
 }
}
dialog.addEventListener('cancel', event => {if (cloudSaving) event.preventDefault();});

async function authenticate(action) {
 if (!cloud) {accountMessage('登录服务加载失败，请刷新网页重试'); return;}
 if (action !== 'reset' && !loginForm.reportValidity()) return;
 const emailField = loginForm.elements.email;
 if (!emailField.reportValidity()) return;
 const email = emailField.value.trim();
 const password = loginForm.elements.password.value;
 const buttons = loginForm.querySelectorAll('button');
 buttons.forEach(button => button.disabled = true);
 accountMessage('正在连接…');
 try {
  let result;
  const redirectTo = 'https://justjoyce2333-eng.github.io/evening-routine/ledger/';
  if (action === 'signup') result = await cloud.auth.signUp({email, password, options:{emailRedirectTo:redirectTo}});
  else if (action === 'reset') result = await cloud.auth.resetPasswordForEmail(email, {redirectTo});
  else result = await cloud.auth.signInWithPassword({email, password});
  if (result.error) throw result.error;
  if (action === 'signup') accountMessage('请到邮箱确认注册，完成后返回这里登录。');
  else if (action === 'reset') accountMessage('请查收重设密码邮件。');
  else {loginForm.reset(); accountDialog.close();}
 } catch (error) { accountMessage(describeError(error)); }
 finally { buttons.forEach(button => button.disabled = false); }
}
loginForm.onsubmit = event => {event.preventDefault(); void authenticate('login');};
$('#signup').onclick = () => authenticate('signup');
$('#reset-password').onclick = () => authenticate('reset');
$('#logout').onclick = async () => {
 const {error} = await cloud.auth.signOut({scope:'local'});
 if (error) {accountMessage('退出失败，请重试'); return;}
 setAccount(null);
 accountDialog.close();
};
$('#new-password').onsubmit = async event => {
 event.preventDefault();
 const passwordForm = $('#new-password');
 if (!passwordForm.reportValidity()) return;
 const {error} = await cloud.auth.updateUser({password:passwordForm.elements.password.value});
 if (error) {accountMessage(describeError(error)); return;}
 passwordForm.reset();
 passwordForm.hidden = true;
 updateAccount();
 accountMessage('密码已更新');
};
$('#import-local').onclick = async () => {
 const account = cloudUser?.id;
 if (!account || cloudSaving) return;
 if (!confirm('将本机账目导入 ' + cloudUser.email + ' 的云端账本？')) return;
 cloudSaving = true;
 refreshSequence++;
 let importFailed = false;
 $('#import-local').disabled = true;
 try {
  // Save identifiers before uploading so retries cannot duplicate an import.
  const disk = JSON.parse(localStorage.getItem(storeKey));
  if (disk?.mine) data.mine = disk.mine;
  data.mine = data.mine.map(entry => ({...entry, id:entry.id || crypto.randomUUID()}));
  save();
  for (let offset = 0; offset < data.mine.length; offset += 500) {
   if (account !== cloudUser?.id) throw new Error('Account changed');
   const {error} = await cloud.rpc('import_ledger_entries', {entries:data.mine.slice(offset,offset+500)});
   if (error) throw error;
  }
  $('#sync-status').textContent = '导入完成';
 } catch {importFailed = true;}
 finally {
  cloudSaving = false;
  $('#import-local').disabled = false;
  await refreshCloud();
  if (importFailed) $('#sync-status').textContent = '导入未完成，请重试';
 }
};
if (cloud) {
 cloud.auth.onAuthStateChange((event, session) => {
  // Run outside the auth callback lock.
  setTimeout(() => {
   setAccount(session?.user || null);
   if (event === 'PASSWORD_RECOVERY') {
    loginForm.hidden = true;
    $('#signed-in').hidden = true;
    $('#new-password').hidden = false;
    showAccount();
   }
  }, 0);
 });
 cloud.auth.getSession().then(({data:sessionData,error}) => {
  if (error) {$('#sync-status').textContent='登录已过期，请重新登录';return;}
  setAccount(sessionData.session?.user || null);
 });
 setInterval(() => {if (!document.hidden) void refreshCloud();}, 10000);
 window.addEventListener('focus', () => void refreshCloud());
 window.addEventListener('online', () => void refreshCloud());
} else {
 $('#sync-status').textContent = '本机保存 · 登录服务加载失败，请刷新';
}
updateAccount();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日账 · 支出日历</title><style>:root {
  color-scheme: light;
  --paper: #faf9f6;
  --surface: #ffffff;
  --ink: #202020;
  --muted: #777670;
  --line: #e8e7e3;
  --soft: #f5f4f0;
  --accent: #24765d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 14px -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button { background: transparent; border: 0; }
button, input, .category span { transition: background .15s, border-color .15s, box-shadow .15s; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
header { background: var(--surface); border-bottom: 1px solid var(--line); }
.nav, main { width: min(1280px, 100%); margin: auto; padding: 0 44px; }
.nav { height: 76px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 11px; font-size: 22px; font-weight: 600; letter-spacing: -.8px; }
.mark { display: grid; place-items: center; width: 30px; height: 30px; }
.mark svg { width: 27px; height: 27px; }
.divider { height: 18px; border-left: 1px solid var(--line); }
.nav select { border: 0; border-radius: 8px; background: transparent; padding: 7px 2px; font-size: 13px; color: #66645f; }
.primary { border-radius: 999px; background: var(--ink); color: #fff; padding: 11px 21px; font-size: 13px; font-weight: 550; }
.primary:hover { background: #41413f; }
.nav .primary { margin-left: auto; }
.primary strong { font-size: 17px; font-weight: 400; margin-right: 4px; }
.intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 45px 0 29px; }
.eyebrow { color: var(--muted); font-size: 12px; font-weight: 400; line-height: 1.5; }
.eyebrow i { display: none; }
h1, h2 { margin: 0; font-weight: 550; }
h1 { font-size: 30px; letter-spacing: -1px; margin-top: 8px; }
.quote { color: #77756f; font-size: 13px; line-height: 1.8; text-align: right; margin: 0 0 3px; }
.layout { display: grid; grid-template-columns: minmax(0, 2.35fr) minmax(270px, 1fr); gap: 24px; padding-bottom: 45px; }
.calendar, aside { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.calendar { padding: 26px 26px 0; }
.monthbar, .datehead, .dialoghead, .listhead { display: flex; align-items: center; justify-content: space-between; }
.monthbar h2 { font-size: 20px; letter-spacing: -.5px; }
.controls { display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--soft); border-radius: 999px; }
.controls button { min-width: 30px; height: 30px; border-radius: 999px; font-size: 22px; line-height: 1; }
.controls button:hover { background: #e9e8e3; }
.controls #today { font-size: 12px; padding: 0 11px; }
.week, #grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
.week { text-align: center; margin: 27px 0 12px; color: var(--muted); font-size: 11px; }
.cell { min-height: 78px; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; position: relative; }
.cell b { font-size: 14px; font-weight: 500; }
.cell small { font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
.cell:hover { box-shadow: inset 0 0 0 1px #9caaa2; }
.cell.out { background: #fafaf8; color: #bbbcb6; }
.cell.selected { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.cell.selected:after { content: ""; position: absolute; right: 9px; top: 12px; height: 4px; width: 4px; border-radius: 50%; background: currentColor; }
footer { display: flex; align-items: center; gap: 38px; background: #fbfbf9; border-top: 1px solid var(--line); margin: 26px -26px 0; padding: 22px 26px; }
footer small, .sum small { display: block; color: var(--muted); font-size: 11px; }
footer b { display: block; font-size: 23px; font-weight: 500; margin-top: 7px; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
.spark { margin-left: auto; display: flex; align-items: end; gap: 3px; height: 36px; }
.spark i { width: 4px; border-radius: 2px 2px 0 0; }
aside { padding: 26px 23px; align-self: start; }
.datehead { margin: 10px 0 22px; }
.datehead h2 { font-size: 22px; letter-spacing: -.7px; }
.datehead small, #count { color: var(--muted); font-size: 11px; font-weight: 400; }
.sum { padding: 21px; background: var(--soft); border-radius: 16px; }
.sum b { display: block; font-size: 36px; font-weight: 500; letter-spacing: -1.5px; margin-top: 9px; font-variant-numeric: tabular-nums; }
.listhead { font-size: 12px; font-weight: 500; margin: 29px 0 7px; }
.record { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; padding: 17px 0; border-bottom: 1px solid #f0efec; }
.record:hover { background: #fafaf8; }
.record:focus-visible { border-radius: 8px; }
.icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
.icon svg { width: 17px; height: 17px; }
.record b, .record strong { font-size: 13px; font-weight: 500; }
.record div { min-width: 0; }
.record b { overflow-wrap: anywhere; }
.record small { display: block; color: var(--muted); font-size: 11px; margin-top: 5px; }
.record strong { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.another { border: 1px solid #deddd8; color: #55544f; padding: 11px; border-radius: 999px; width: 100%; margin-top: 22px; font-size: 12px; }
.another:hover { background: var(--soft); }
.empty { color: var(--muted); text-align: center; padding: 27px 0; font-size: 13px; }
dialog { width: min(408px, calc(100vw - 32px)); max-height: 90vh; overflow-y: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: 0 24px 80px #0002; }
dialog::backdrop { background: #17171555; backdrop-filter: blur(3px); }
.dialoghead { margin-bottom: 24px; }
.dialoghead h2 { font-size: 23px; letter-spacing: -.6px; }
.dialoghead button { display: grid; place-items: center; font-size: 25px; width: 30px; height: 30px; border-radius: 50%; color: #777; }
.dialoghead button:hover { background: var(--soft); }
label { display: block; font-size: 12px; margin: 17px 0; }
input { display: block; width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 11px; padding: 12px; margin-top: 8px; background: #fafaf8; outline: none; }
input:focus { border-color: #777670; box-shadow: 0 0 0 2px #2020200a; background: #fff; }
form .primary { width: 100%; padding: 13px; }
.categories { border: 0; margin: 20px 0 26px; padding: 0; min-width: 0; }
.categories legend { font-size: 12px; padding: 0; margin-bottom: 10px; }
#categories { display: flex; flex-wrap: wrap; gap: 7px; }
.category { position: relative; margin: 0; cursor: pointer; }
.category input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; padding: 0; }
.category span { display: block; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; color: #66645f; background: #fff; font-size: 12px; }
.category:hover span { background: var(--soft); }
.category input:checked+span { background: var(--ink); color: #fff; border-color: var(--ink); }
.category input:focus-visible+span { outline: 2px solid var(--ink); outline-offset: 3px; }
#error { display: block; margin-top: 10px; color: #a13932; font-size: 12px; }
@media(max-width: 950px) {
  .nav, main { padding-left: 28px; padding-right: 28px; }
  .layout { gap: 16px; grid-template-columns: minmax(0, 1.9fr) minmax(240px, 1fr); }
  .calendar { padding: 22px 18px 0; }
  aside { padding: 22px 18px; }
  .cell { min-height: 69px; padding: 8px; }
  footer { margin-left: -18px; margin-right: -18px; padding: 20px 18px; gap: 25px; }
  .spark { display: none; }
}
@media(max-width: 700px) {
  .nav, main { padding-left: 18px; padding-right: 18px; }
  .nav { height: 65px; gap: 13px; }
  .brand { font-size: 20px; gap: 7px; }
  .primary { padding: 10px 16px; }
  .intro { padding: 30px 0 23px; align-items: flex-start; gap: 16px; }
  h1 { font-size: 27px; }
  .quote { max-width: 145px; font-size: 11px; margin-top: 24px; }
  .layout { grid-template-columns: 1fr; }
  .calendar { padding: 20px 14px 0; border-radius: 18px; }
  .week, #grid { gap: 5px; }
  .week { margin-top: 23px; }
  .cell { min-height: 64px; padding: 8px 5px; border-radius: 8px; }
  .cell small { font-size: 10px; }
  .cell b { font-size: 13px; }
  footer { margin: 22px -14px 0; padding: 19px; }
  footer b { font-size: 21px; }
  .spark { display: flex; gap: 2px; }
  .spark i { width: 3px; }
  aside { padding: 23px; border-radius: 18px; }
}
@media(prefers-reduced-motion: reduce) {
  button, input, .category span { transition: none; }
  dialog::backdrop { backdrop-filter: none; }
}
</style></head><body><header><div class="nav"><b class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 3v18M11 8h5M11 12h5M11 16h3"/></svg></span>日账</b><span class="divider"></span><select id="book" aria-label="选择账本"><option value="demo">示例账本</option><option value="mine">我的账本</option></select><button id="add" class="primary"><strong>＋</strong> 记一笔</button></div></header><main><div class="intro"><div><div class="eyebrow"><i></i> 每月总览</div><h1>支出日历</h1></div><blockquote class="quote">“一粥一饭，当思来处不易。”</blockquote></div><div class="layout"><section class="calendar"><div class="monthbar"><h2 id="month"></h2><div class="controls"><button id="prev" aria-label="上个月">‹</button><button id="today">今天</button><button id="next" aria-label="下个月">›</button></div></div><div class="week"></div><div id="grid"></div><footer><div><small>本月支出</small><b id="total"></b></div><div><small>日均支出</small><b id="avg"></b></div><div class="spark" aria-hidden="true"></div></footer></section><aside><div class="eyebrow"><i></i> 当日明细</div><div class="datehead"><h2 id="date"></h2><small id="weekday"></small></div><div class="sum"><small>当日支出</small><b id="daytotal"></b></div><div class="listhead">支出记录 <span id="count"></span></div><div id="records"></div><button class="another" id="addday">＋ 添加支出</button></aside></div></main><dialog><form><div class="dialoghead"><h2>记一笔</h2><button type="button" id="close" aria-label="关闭">×</button></div><label>日期<input name="date" type="date" required></label><label>金额（元）<input name="amount" type="number" step=".01" min=".01" max="99999999" required></label><label>项目<input name="name" maxlength="40" required></label><fieldset class="categories"><legend>分类</legend><div id="categories"></div></fieldset><button class="primary">保存</button><small id="error" role="alert"></small></form></dialog><script>const $=s=>document.querySelector(s);
const colors=['#f3f4f0','#e4eee6','#c8dfd0','#99c7ae','#538c73','#2e6450'];
const categories=['餐饮','咖啡','交通','购物','其他'];
const icons=['<path d="M5 3v6c0 3 5 3 5 0V3M7.5 3v18M18 21V3c-4 3-5 9 0 10"/>','<path d="M3 7h13v6a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6zM16 8h2a3 3 0 0 1 0 6h-2M3 21h15"/>','<rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 10h14M8 21l2-3m6 3-2-3M8 14h2m4 0h2"/>','<path d="M4 8h16l-1 13H5zM8 9V7a4 4 0 0 1 8 0v2"/>','<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8"/>'];
const tints=Array(5).fill('#f3f3ef');
const ink=Array(5).fill('#696962');
const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const parse=k=>new Date(k+'T12:00:00');
const money=c=>'¥'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function seed(){
 const rows=[],names=['午餐','拿铁咖啡','地铁通勤','生活用品','日常支出'];
 for(let day=1;day<=31;day++){
 if([4,11,19,24,30].includes(day))continue;
 const date=key(new Date(2026,9,day));
 if(day===16){[['午餐套餐',3800,0],['燕麦拿铁',2800,1],['地铁通勤',600,2],['超市采购',6840,3]].forEach(([name,amount,c])=>rows.push({date,name,amount,c}));continue;}
 for(let j=0;j<1+(day*7%4);j++){const c=(day+j*2)%5;rows.push({date,name:names[c],amount:([2300,1800,400,4900,1200][c]+((day*11)%13)*100)*(day%8===0?3:1),c});}
 }return rows;
}
const storeKey='rizhang-calendar-v1';
let data={demo:seed(),mine:[]},book='demo',selected=parse('2026-10-16');
try{const saved=JSON.parse(localStorage.getItem(storeKey));if(saved&&Array.isArray(saved.mine)&&Array.isArray(saved.demo)){data=saved;book=saved.book==='mine'?'mine':'demo';selected=parse(saved.selected||key(selected));}}catch{}
const save=()=>localStorage.setItem(storeKey,JSON.stringify({...data,book,selected:key(selected)}));
$('.week').innerHTML=Array.from('一二三四五六日',d=>'<span>周'+d+'</span>').join('');
$('#categories').innerHTML = categories.map((category, index) =>
 '<label class="category"><input type="radio" name="category" value="' + index + '"' +
 (index === 0 ? ' checked' : '') + '><span>' + category + '</span></label>'
).join('');
function render(){
 const y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7, sums=Array(days).fill(0);
 const prefix=key(first).slice(0,7), records=data[book].filter(r=>r.date===key(selected));
 for(const r of data[book])if(r.date.startsWith(prefix+'-'))sums[+r.date.slice(-2)-1]+=r.amount;
 const max=Math.max(1,...sums),total=sums.reduce((a,b)=>a+b,0),level=v=>v?Math.min(5,Math.ceil(5*v/max)):0;
 $('#book').value=book;$('#month').textContent=y+'年 '+(m+1)+'月';$('#grid').replaceChildren();
 for(let i=0;i<Math.ceil((days+offset)/7)*7;i++){
 const d=new Date(y,m,i-offset+1),outside=d.getMonth()!==m,day=d.getDate(),val=sums[day-1],on=key(d)===key(selected);
 const btn=document.createElement('button');btn.className='cell'+(outside?' out':'')+(on?' selected':'');
 if(!outside){btn.style.background=colors[level(val)];btn.style.color=level(val)>=4?'#fff':'#303e35';}
 btn.innerHTML='<b>'+day+'</b>'+(!outside&&val?'<small>¥'+(val/100).toLocaleString('en-US')+'</small>':'');btn.setAttribute('aria-label',key(d)+(outside?'':' 支出'+money(val)));btn.setAttribute('aria-pressed',on);
 btn.onclick=()=>{selected=d;render()};$('#grid').append(btn);
 }
 $('#total').textContent=money(total);$('#avg').textContent=money(Math.round(total/days));$('.spark').innerHTML=sums.map(v=>'<i style="height:'+Math.max(3,36*v/max)+'px;background:'+colors[Math.max(2,level(v))]+'"></i>').join('');
 $('#date').textContent=(m+1)+'月'+selected.getDate()+'日';$('#weekday').textContent='星期'+'日一二三四五六'[selected.getDay()];$('#daytotal').textContent=money(sums[selected.getDate()-1]);$('#count').textContent=records.length+' 笔';
 $('#records').innerHTML=records.length?'':'<p class="empty">当天暂无支出</p>';
 records.forEach(record => {
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'record';
  row.setAttribute('aria-label', '修改 ' + record.name + ' ' + money(record.amount));
  row.innerHTML = '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">' + icons[record.c] + '</svg></span><div><b></b><small></small></div><strong></strong>';
  row.firstChild.style.background = tints[record.c];
  row.firstChild.style.color = ink[record.c];
  row.querySelector('b').textContent = record.name;
  row.querySelector('small').textContent = categories[record.c];
  row.lastChild.textContent = money(record.amount);
  row.onclick = () => openEntry(data[book].indexOf(record));
  $('#records').append(row);
 });
}
$('#book').onchange=e=>{book=e.target.value;selected=book==='mine'?new Date():parse('2026-10-16');render();try{save()}catch{}};
$('#prev').onclick=()=>{selected=new Date(selected.getFullYear(),selected.getMonth()-1,1);render()};
$('#next').onclick=()=>{selected=new Date(selected.getFullYear(),selected.getMonth()+1,1);render()};
$('#today').onclick=()=>{selected=new Date();render()};
const form=$('form'),dialog=$('dialog');
let editingIndex = null;
function openEntry(index = null) {
 form.reset();
 editingIndex = index;
 const record = index === null ? null : data[book][index];
 $('.dialoghead h2').textContent = record ? '修改支出' : '记一笔';
 form.elements.date.value = record ? record.date : key(selected);
 form.elements.amount.value = record ? (record.amount / 100).toFixed(2) : '';
 form.elements.name.value = record ? record.name : '';
 form.elements.category.value = record ? String(record.c) : '0';
 $('#error').textContent = '';
 dialog.showModal();
 form.elements.amount.focus();
}
$('#add').onclick = $('#addday').onclick = () => openEntry();
$('#close').onclick = () => dialog.close();
form.onsubmit = event => {
 event.preventDefault();
 if (!form.reportValidity()) return;
 const fields = new FormData(form);
 const name = fields.get('name').trim();
 if (!name) {
  $('#error').textContent = '请输入项目名称';
  return;
 }
 const date = fields.get('date');
 const amount = Math.round(Number(fields.get('amount')) * 100);
 const category = Number(fields.get('category'));
 if (!Number.isSafeInteger(amount) || amount < 1 || amount > 9999999900 ||
     !categories[category] || !date || Number.isNaN(parse(date).getTime())) {
  $('#error').textContent = '请检查日期、金额和分类';
  return;
 }
 const entry = {name, date, amount, c: category};
 const entries = data[book].slice();
 if (editingIndex === null) entries.push(entry);
 else entries[editingIndex] = entry;
 const updated = {...data, [book]: entries};
 try {
  localStorage.setItem(storeKey, JSON.stringify({...updated, book, selected: date}));
 } catch {
  $('#error').textContent = '保存失败，请检查浏览器存储空间';
  return;
 }
 data = updated;
 selected = parse(date);
 dialog.close();
 render();
};
render();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日账 · 支出日历</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#23392e;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{background:#fcfdf9;border-bottom:1px solid #dce1d7}.nav,main{max-width:1380px;margin:auto;padding:0 5.3vw}.nav{height:74px;display:flex;align-items:center;gap:19px}.brand{display:flex;gap:10px;align-items:center;font-size:23px;letter-spacing:-1px}.mark{background:#26543b;color:#f3f6dd;border-radius:9px;width:35px;height:35px;display:grid;place-items:center;font:27px Georgia;transform:rotate(-4deg)}.divider{height:19px;border-left:1px solid #d5dace}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}button{background:transparent;border:0}.nav select{background:transparent;border:0;font-size:13px}.primary{background:#295a40;color:white;padding:10px 19px;border-radius:9px;font-weight:600}.nav .primary{margin-left:auto}.intro{display:flex;align-items:flex-end;justify-content:space-between;padding:42px 0 25px}.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;color:#667969;font-weight:600;letter-spacing:1px}.eyebrow i{background:#7f9a61;width:7px;height:7px;border-radius:50%}h1,h2{margin:0}h1{font-size:clamp(28px,2.5vw,36px);letter-spacing:-1px;margin-top:7px}.legend,.legend span{display:flex;align-items:center;gap:5px}.legend{font-size:12px;color:#758073;gap:9px;margin-bottom:5px}.legend i{width:16px;height:13px;border-radius:3px}.layout{display:grid;grid-template-columns:minmax(0,2.45fr) minmax(250px,1fr);gap:20px;padding-bottom:40px}.calendar,aside{background:#fffefa;border:1px solid #dce1d6;border-radius:18px;overflow:hidden}.calendar{padding:25px 25px 0}.monthbar,.datehead,.dialoghead,.listhead{display:flex;align-items:center;justify-content:space-between}.monthbar h2,.datehead h2{font-size:24px;letter-spacing:-1px}.controls{display:flex;align-items:center;border:1px solid #dee2d8;border-radius:8px}.controls button{height:31px;min-width:31px;font-size:20px}.controls #today{font-size:12px}.week,#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week{color:#738174;font-size:12px;text-align:center;margin:23px 0 10px}.cell{min-height:clamp(59px,5.15vw,79px);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;position:relative}.cell b{font-size:16px;font-weight:550}.cell small{font-size:12px;font-variant-numeric:tabular-nums}.cell.out{background:#f7f8f4;color:#bfc6bc}.cell.selected{outline:2px solid #234c35;outline-offset:1px}.cell.selected:after{content:"";position:absolute;right:8px;top:9px;width:6px;height:6px;background:currentColor;border-radius:50%}footer{margin:23px -25px 0;padding:18px 25px;background:#f7f9f1;border-top:1px solid #e3e7da;display:flex;align-items:center;gap:30px}footer small,.sum small{display:block;color:#687c69;font-size:12px}footer b{display:block;font-size:23px;margin-top:4px;letter-spacing:-.7px}.spark{margin-left:auto;display:flex;align-items:end;gap:3px;height:36px}.spark i{width:4px;border-radius:3px 3px 0 0}aside{padding:25px 23px;align-self:start}.datehead{margin:12px 0 18px}.datehead small,#count{color:#7d877c;font-size:12px}.sum{padding:19px;background:#edf3e5;border-radius:11px}.sum b{display:block;font-size:38px;letter-spacing:-1.6px;margin-top:6px}.listhead{font-size:14px;font-weight:650;margin:26px 0 5px}.record{display:flex;align-items:center;gap:11px;padding:17px 0;border-bottom:1px solid #e9ece3}.icon{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}.icon svg{width:19px;height:19px}.record b,.record strong{font-size:14px}.record div{min-width:0}.record b{overflow-wrap:anywhere}.record small{display:block;color:#848b80;font-size:11px;margin-top:4px}.record strong{margin-left:auto;white-space:nowrap}.another{border:1px dashed #c6d0be;color:#526b51;padding:10px;border-radius:8px;width:100%;margin-top:21px;font-size:13px}dialog{border:1px solid #d5ddce;border-radius:16px;width:min(360px,93vw);padding:25px;color:inherit}dialog::backdrop{background:#192e2370}label{display:block;font-size:13px;margin:15px 0}input,form select{display:block;width:100%;border:1px solid #cfd7ca;border-radius:6px;padding:9px;margin-top:5px;background:white}.dialoghead button{font-size:24px}form .primary{width:100%}.empty{color:#849080;text-align:center;padding:25px 0;font-size:13px}button:hover{filter:brightness(.95)}@media(max-width:850px){.nav,main{padding-left:4vw;padding-right:4vw}.calendar,aside{padding:18px}.calendar{padding-bottom:0}.layout{gap:12px;grid-template-columns:minmax(0,1.9fr) minmax(211px,1fr)}.spark{display:none}footer{margin-left:-18px;margin-right:-18px}.cell{padding:7px}.record{gap:6px}}@media(max-width:660px){.layout{grid-template-columns:1fr}.intro{padding:25px 0 17px}.nav{height:61px}.calendar{padding:17px 12px 0}.week,#grid{gap:4px}.cell{min-height:56px;padding:6px 4px}.cell small{font-size:10px}.cell b{font-size:14px}.monthbar h2{font-size:21px}.week{margin-top:16px}.spark{display:flex}.spark i{width:2px}footer{gap:20px;margin-top:16px;padding:14px 19px}footer b{font-size:19px}.datehead{justify-content:flex-start;gap:12px}}

.quote{margin:0 0 4px 20px;color:#6c7d69;font-size:14px;line-height:1.8;text-align:right}.record{width:100%;text-align:left}.record:focus-visible{outline:2px solid #295a40;outline-offset:3px;border-radius:8px}.record:hover{background:#f5f7ef}.categories{border:0;margin:15px 0 22px;padding:0;min-width:0}.categories legend{font-size:13px;margin-bottom:9px;padding:0}#categories{display:flex;flex-wrap:wrap;gap:7px}.category{position:relative;margin:0;cursor:pointer}.category input{position:absolute;opacity:0;width:1px;height:1px;margin:0;padding:0}.category span{display:block;padding:8px 13px;border:1px solid #d4ddcd;border-radius:8px;background:#fffefa;font-size:13px}.category input:checked+span{background:#e1edd9;border-color:#295a40;color:#254e35;font-weight:650}.category input:focus-visible+span{outline:2px solid #295a40;outline-offset:3px}dialog{max-height:90vh;overflow-y:auto}#error{display:block;margin-top:8px;color:#9b3636}@media(max-width:660px){.intro{align-items:flex-start;gap:12px}.quote{max-width:145px;font-size:12px;margin:26px 0 0}}
</style></head><body><header><div class="nav"><b class="brand"><span class="mark">▥</span>日账</b><span class="divider"></span><select id="book" aria-label="选择账本"><option value="demo">示例账本</option><option value="mine">我的账本</option></select><button id="add" class="primary"><strong>＋</strong> 记一笔</button></div></header><main><div class="intro"><div><div class="eyebrow"><i></i> 每月总览</div><h1>支出日历</h1></div><blockquote class="quote">“一粥一饭，当思来处不易。”</blockquote></div><div class="layout"><section class="calendar"><div class="monthbar"><h2 id="month"></h2><div class="controls"><button id="prev" aria-label="上个月">‹</button><button id="today">今天</button><button id="next" aria-label="下个月">›</button></div></div><div class="week"></div><div id="grid"></div><footer><div><small>本月支出</small><b id="total"></b></div><div><small>日均支出</small><b id="avg"></b></div><div class="spark" aria-hidden="true"></div></footer></section><aside><div class="eyebrow"><i></i> 当日明细</div><div class="datehead"><h2 id="date"></h2><small id="weekday"></small></div><div class="sum"><small>当日支出</small><b id="daytotal"></b></div><div class="listhead">支出记录 <span id="count"></span></div><div id="records"></div><button class="another" id="addday">＋ 添加支出</button></aside></div></main><dialog><form><div class="dialoghead"><h2>记一笔</h2><button type="button" id="close" aria-label="关闭">×</button></div><label>日期<input name="date" type="date" required></label><label>金额（元）<input name="amount" type="number" step=".01" min=".01" max="99999999" required></label><label>项目<input name="name" maxlength="40" required></label><fieldset class="categories"><legend>分类</legend><div id="categories"></div></fieldset><button class="primary">保存</button><small id="error" role="alert"></small></form></dialog><script>const $=s=>document.querySelector(s);
const colors=['#f0f2e9','#e0ebd4','#c7ddb8','#9ec394','#6f9f77','#417354'];
const categories=['餐饮','咖啡','交通','购物','其他'];
const icons=['<path d="M5 3v6c0 3 5 3 5 0V3M7.5 3v18M18 21V3c-4 3-5 9 0 10"/>','<path d="M3 7h13v6a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6zM16 8h2a3 3 0 0 1 0 6h-2M3 21h15"/>','<rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 10h14M8 21l2-3m6 3-2-3M8 14h2m4 0h2"/>','<path d="M4 8h16l-1 13H5zM8 9V7a4 4 0 0 1 8 0v2"/>','<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8"/>'];
const tints=['#f3e8d6','#ede3d6','#e2ebef','#e7e4ed','#e6ecdc'];
const ink=['#947341','#98714b','#5a7586','#867296','#778369'];
const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const parse=k=>new Date(k+'T12:00:00');
const money=c=>'¥'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function seed(){
 const rows=[],names=['午餐','拿铁咖啡','地铁通勤','生活用品','日常支出'];
 for(let day=1;day<=31;day++){
 if([4,11,19,24,30].includes(day))continue;
 const date=key(new Date(2026,9,day));
 if(day===16){[['午餐套餐',3800,0],['燕麦拿铁',2800,1],['地铁通勤',600,2],['超市采购',6840,3]].forEach(([name,amount,c])=>rows.push({date,name,amount,c}));continue;}
 for(let j=0;j<1+(day*7%4);j++){const c=(day+j*2)%5;rows.push({date,name:names[c],amount:([2300,1800,400,4900,1200][c]+((day*11)%13)*100)*(day%8===0?3:1),c});}
 }return rows;
}
const storeKey='rizhang-calendar-v1';
let data={demo:seed(),mine:[]},book='demo',selected=parse('2026-10-16');
try{const saved=JSON.parse(localStorage.getItem(storeKey));if(saved&&Array.isArray(saved.mine)&&Array.isArray(saved.demo)){data=saved;book=saved.book==='mine'?'mine':'demo';selected=parse(saved.selected||key(selected));}}catch{}
const save=()=>localStorage.setItem(storeKey,JSON.stringify({...data,book,selected:key(selected)}));
$('.week').innerHTML=Array.from('一二三四五六日',d=>'<span>周'+d+'</span>').join('');
$('#categories').innerHTML = categories.map((category, index) =>
 '<label class="category"><input type="radio" name="category" value="' + index + '"' +
 (index === 0 ? ' checked' : '') + '><span>' + category + '</span></label>'
).join('');
function render(){
 const y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7, sums=Array(days).fill(0);
 const prefix=key(first).slice(0,7), records=data[book].filter(r=>r.date===key(selected));
 for(const r of data[book])if(r.date.startsWith(prefix+'-'))sums[+r.date.slice(-2)-1]+=r.amount;
 const max=Math.max(1,...sums),total=sums.reduce((a,b)=>a+b,0),level=v=>v?Math.min(5,Math.ceil(5*v/max)):0;
 $('#book').value=book;$('#month').textContent=y+'年 '+(m+1)+'月';$('#grid').replaceChildren();
 for(let i=0;i<Math.ceil((days+offset)/7)*7;i++){
 const d=new Date(y,m,i-offset+1),outside=d.getMonth()!==m,day=d.getDate(),val=sums[day-1],on=key(d)===key(selected);
 const btn=document.createElement('button');btn.className='cell'+(outside?' out':'')+(on?' selected':'');
 if(!outside){btn.style.background=colors[level(val)];btn.style.color=level(val)>=4?'#fff':'#2d4937';}
 btn.innerHTML='<b>'+day+'</b>'+(!outside&&val?'<small>¥'+(val/100).toLocaleString('en-US')+'</small>':'');btn.setAttribute('aria-label',key(d)+(outside?'':' 支出'+money(val)));btn.setAttribute('aria-pressed',on);
 btn.onclick=()=>{selected=d;render()};$('#grid').append(btn);
 }
 $('#total').textContent=money(total);$('#avg').textContent=money(Math.round(total/days));$('.spark').innerHTML=sums.map(v=>'<i style="height:'+Math.max(3,36*v/max)+'px;background:'+colors[Math.max(2,level(v))]+'"></i>').join('');
 $('#date').textContent=(m+1)+'月'+selected.getDate()+'日';$('#weekday').textContent='星期'+'日一二三四五六'[selected.getDay()];$('#daytotal').textContent=money(sums[selected.getDate()-1]);$('#count').textContent=records.length+' 笔';
 $('#records').innerHTML=records.length?'':'<p class="empty">当天暂无支出</p>';
 records.forEach(record => {
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'record';
  row.setAttribute('aria-label', '修改 ' + record.name + ' ' + money(record.amount));
  row.innerHTML = '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">' + icons[record.c] + '</svg></span><div><b></b><small></small></div><strong></strong>';
  row.firstChild.style.background = tints[record.c];
  row.firstChild.style.color = ink[record.c];
  row.querySelector('b').textContent = record.name;
  row.querySelector('small').textContent = categories[record.c];
  row.lastChild.textContent = money(record.amount);
  row.onclick = () => openEntry(data[book].indexOf(record));
  $('#records').append(row);
 });
}
$('#book').onchange=e=>{book=e.target.value;selected=book==='mine'?new Date():parse('2026-10-16');render();try{save()}catch{}};
$('#prev').onclick=()=>{selected=new Date(selected.getFullYear(),selected.getMonth()-1,1);render()};
$('#next').onclick=()=>{selected=new Date(selected.getFullYear(),selected.getMonth()+1,1);render()};
$('#today').onclick=()=>{selected=new Date();render()};
const form=$('form'),dialog=$('dialog');
let editingIndex = null;
function openEntry(index = null) {
 form.reset();
 editingIndex = index;
 const record = index === null ? null : data[book][index];
 $('.dialoghead h2').textContent = record ? '修改支出' : '记一笔';
 form.elements.date.value = record ? record.date : key(selected);
 form.elements.amount.value = record ? (record.amount / 100).toFixed(2) : '';
 form.elements.name.value = record ? record.name : '';
 form.elements.category.value = record ? String(record.c) : '0';
 $('#error').textContent = '';
 dialog.showModal();
 form.elements.amount.focus();
}
$('#add').onclick = $('#addday').onclick = () => openEntry();
$('#close').onclick = () => dialog.close();
form.onsubmit = event => {
 event.preventDefault();
 if (!form.reportValidity()) return;
 const fields = new FormData(form);
 const name = fields.get('name').trim();
 if (!name) {
  $('#error').textContent = '请输入项目名称';
  return;
 }
 const date = fields.get('date');
 const amount = Math.round(Number(fields.get('amount')) * 100);
 const category = Number(fields.get('category'));
 if (!Number.isSafeInteger(amount) || amount < 1 || amount > 9999999900 ||
     !categories[category] || !date || Number.isNaN(parse(date).getTime())) {
  $('#error').textContent = '请检查日期、金额和分类';
  return;
 }
 const entry = {name, date, amount, c: category};
 const entries = data[book].slice();
 if (editingIndex === null) entries.push(entry);
 else entries[editingIndex] = entry;
 const updated = {...data, [book]: entries};
 try {
  localStorage.setItem(storeKey, JSON.stringify({...updated, book, selected: date}));
 } catch {
  $('#error').textContent = '保存失败，请检查浏览器存储空间';
  return;
 }
 data = updated;
 selected = parse(date);
 dialog.close();
 render();
};
render();
</script></body></html>

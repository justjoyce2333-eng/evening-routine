<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8f5">
<meta name="description" content="早间、白天、晚上三段式每日时间表；实时红线、自由配色、晚间双版本与白天提醒。">
<title>每日时间表 · 我的每一天</title>
<link rel="icon" href="./favicon.svg?v=1" type="image/svg+xml" sizes="any">
<link rel="shortcut icon" href="./favicon.svg?v=1" type="image/svg+xml">
<style>

/* Refined ChatGPT-inspired styling — no official OpenAI marks used. */
:root{
  --bg:#f7f7f8;--ink:#202123;--muted:#777b82;--paper:#fff;
  --green:#0f9d78;--green-dark:#08785c;--red:#e1525b;
  --stroke:#e7e7e7;--radius:18px;
  color-scheme:light;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-synthesis:none;
}
/* All dimensions now include padding and borders: no task can spill past its minute slot. */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:106px}
body{
  background:var(--bg);
  color:var(--ink);
  margin:0;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.page{width:min(1040px,calc(100% - 48px));padding:38px 0 76px;margin:auto}
.top{padding:0 2px 25px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brandmark{
  width:44px;height:44px;flex:0 0 44px;
  display:grid;place-items:center;background:#202321;color:white;
  border-radius:14px;box-shadow:0 2px 7px #10131313;
}
.brandmark svg{width:23px;height:23px;display:block}
.kicker{
  margin:0 0 3px;font-size:10px;font-weight:750;
  color:var(--green-dark);letter-spacing:.16em;line-height:1.4
}
h1{margin:0 0 5px;font-size:clamp(25px,3.4vw,32px);line-height:1.2;font-weight:735;letter-spacing:-.045em}
.date{font-size:12px;color:#7e8480;line-height:1.5;font-variant-numeric:tabular-nums}
.clock-box{
  min-width:160px;display:flex;flex-direction:column;
  text-align:right;align-items:flex-end;gap:2px;
}
.clock{font-size:23px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:710;color:#252a26}
.now-activity{margin:0;line-height:1.45;max-width:260px;font-size:11px;color:#858a85;overflow-wrap:anywhere}
.nav{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:10px;margin:0 0 24px;border-radius:16px;background:#ffffffed;
  border:1px solid #e9e9e9;box-shadow:0 8px 22px #14181706;backdrop-filter:blur(14px)
}
.nav button[data-nav]{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:11px 15px;min-height:42px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:#636a66;font-size:13px;font-weight:665;
  line-height:1.2;white-space:nowrap;box-shadow:none;
  transition:background .16s,color .16s,border-color .16s;
}
.nav button[data-nav] svg{display:block;width:17px;height:17px;flex:0 0 17px;stroke-width:1.85}
.nav button[data-nav] small{font-size:10px;color:#969d98;white-space:nowrap;font-variant-numeric:tabular-nums}
.nav button[data-nav]:hover{background:#f2f4f2}
.nav button[data-nav].is-current{
  background:#202321;color:#fff;border-color:#202321;box-shadow:0 3px 8px #10151218;
}
.nav button[data-nav].is-current small{color:#c1cbc5}
.nav button[data-nav].is-current:hover{background:#202321}
.nav .spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;border-radius:10px;border:1px solid #e3e5e2;
  background:#fff;color:#56605a;padding:10px 13px;
  font-size:12px;line-height:1.2;font-weight:675;white-space:nowrap;
  transition:background .16s,border-color .16s;
}
.btn svg{width:15px;height:15px;display:block;flex:0 0 15px}
.btn:hover{background:#f5f6f5;border-color:#d3dad5}
.section{
  background:#fff;border:1px solid var(--stroke);border-radius:20px;
  padding:28px 30px 28px;margin:0;
  box-shadow:0 12px 34px #111b1406;
  scroll-margin-top:104px;
}
.section[hidden]{display:none!important}
.section-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 26px}
.section-id{font-size:10px;line-height:1.3;font-weight:730;letter-spacing:.145em;color:#959b95;margin:0 0 12px}
.section-name{display:flex;align-items:center;gap:11px}
.section-name h2{margin:0;font-size:24px;font-weight:720;line-height:1.25;letter-spacing:-.035em}
.section-emoji{
  width:36px;height:36px;flex:0 0 36px;
  display:grid;place-items:center;background:#eff7f2;
  border:1px solid #e0ede4;border-radius:11px;color:var(--green-dark);
}
.section-emoji svg{display:block;width:19px;height:19px;stroke-width:1.9}
.section-range{
  border:1px solid #eee;background:#f7f8f7;border-radius:10px;color:#626b65;
  font-weight:660;font-size:12px;line-height:1.2;padding:11px 13px;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.section-subtitle{font-size:12px;color:#8b918c;margin:10px 0 0;line-height:1.6}
.section-note{margin:14px 0 0 67px;font-size:11px;color:#929a94;line-height:1.55}
.rail-layout{display:flex;gap:0;position:relative}
.rail{flex:0 0 67px;width:67px;position:relative;height:calc(var(--minutes) * var(--minute-size))}
.tick{
  position:absolute;right:13px;transform:translateY(-50%);
  text-align:right;font-size:11px;font-weight:530;color:#9ba29c;
  white-space:nowrap;line-height:1;letter-spacing:-.015em;font-variant-numeric:tabular-nums;
}
.tick:first-child{transform:translateY(1px)}
.tick.major{color:#68756c;font-weight:710}
.plot{
  --track-pad:6px;position:relative;min-width:0;flex:1;
  height:calc(var(--minutes) * var(--minute-size));
  border-left:1px solid #e4e9e4;
  border-radius:7px;
  background:linear-gradient(90deg,#fbfcfb,#fff);
}
.gridline{position:absolute;z-index:0;left:0;right:0;border-top:1px solid #f0f1f0;pointer-events:none}
.gridline.major{border-top-color:#e8ece8}
.task{
  position:absolute;left:var(--track-pad);right:var(--track-pad);
  z-index:2;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  border-radius:10px;border:1px solid #16251b0d;
  background:var(--task-bg);color:var(--task-ink,#202321);
  padding:9px 42px 9px 16px;min-width:0;
  transition:box-shadow .16s ease,background .16s ease;
}
.task:hover{box-shadow:inset 0 0 0 1px #20232133;z-index:3}
.task.active{box-shadow:inset 0 0 0 2px #08785caa}
.task.long{justify-content:flex-start;padding-top:17px}
.task-title{
  display:flex;align-items:center;gap:9px;min-width:0;
  font-size:13px;font-weight:675;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere;
}
.task-title>span:last-child{min-width:0;flex:1}
.task-icon{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;
  width:22px;height:22px;padding:0;margin:0;
  border-radius:7px;background:#ffffff94;
  line-height:1;font-size:13px;vertical-align:middle;
}
.task-time{
  margin-left:31px;font-size:11px;line-height:1.2;opacity:.68;
  font-variant-numeric:tabular-nums;font-weight:575;white-space:nowrap
}
.task-desc{font-size:11px;opacity:.75;margin:3px 0 0 31px;line-height:1.45}
.task.short{
  flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;
  padding:1px 39px 1px 13px;border-radius:8px;
}
.task.short .task-icon{display:none}
.task.short .task-title{
  display:block;flex:1;max-width:none;min-width:0;font-size:12px;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.task.short .task-time{
  display:block;position:static;transform:none;
  flex:0 0 auto;margin:0;font-size:10px;white-space:nowrap;line-height:1.15;
}
.color{
  position:absolute;right:12px;top:9px;
  display:block;width:23px;height:23px;padding:0;
  border:3px solid #fffc;outline:1px solid #3243392b;
  border-radius:50%;background:transparent;
  cursor:pointer;opacity:.82;transition:transform .15s,opacity .15s;
}
.task:hover .color,.color:focus-visible{opacity:1;transform:scale(1.07)}
.color::-webkit-color-swatch-wrapper{padding:0}
.color::-webkit-color-swatch{border:0;border-radius:50%}
.color::-moz-color-swatch{border:0;border-radius:50%}
.task.short .color{
  top:50%;right:10px;width:19px;height:19px;transform:translateY(-50%);
}
.task.short:hover .color{transform:translateY(-50%) scale(1.08)}
.task.afternoon{padding:17px 18px 10px 18px}
.task.afternoon .color{top:14px;right:13px}
.task.afternoon .task-title{padding-right:26px}
.task.afternoon .task-time{margin-left:31px}
.pill-reminder{
  display:inline-flex;align-items:center;max-width:calc(100% - 4px);
  border-radius:10px;margin-top:13px;padding:10px 12px;
  background:#fffc;border:1px solid #d6e6d9;
  color:#41664a;font-size:12px;font-weight:700;line-height:1.4;
}
.pill-reminder small{display:block;color:#788a7b;font-size:10px;font-weight:540;margin-top:3px}
.reminder-label{font-size:11px;color:#7a8a7d;margin:13px 0 0 31px}
.reminder-row{
  position:absolute;left:15px;right:15px;min-height:44px;
  display:grid;grid-template-columns:18px 126px minmax(0,1fr);align-items:center;gap:12px;
  padding:7px 12px;border:1px solid #dfe9df;border-radius:10px;
  background:#ffffffda;color:#313c35;transition:background .2s;
}
.reminder-row.due{background:#fff2d0;border-color:#e9c678}
.reminder-row.done{opacity:.56}
.reminder-row input[type=checkbox]{
  width:17px;height:17px;margin:0;padding:0;display:block;accent-color:var(--green-dark);cursor:pointer;
}
.reminder-row input[type=time]{
  display:block;width:100%;max-width:100%;min-width:0;height:32px;
  font-size:12px;font-weight:660;color:#5c6a60;line-height:1.2;
  background:#f5f8f5;border:1px solid #e8efe8;border-radius:7px;
  padding:3px 6px;font-variant-numeric:tabular-nums;cursor:pointer;
}
.rem-title{display:flex;align-items:center;gap:9px;min-width:0;font-size:12px;font-weight:670;line-height:1.35}
.rem-icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;width:22px;height:22px;line-height:1;background:#f1f5f1;border-radius:7px;font-size:12px}
.rem-text{min-width:0;overflow-wrap:anywhere}
.evening-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 17px}
.segmented{
  display:inline-flex;align-items:center;gap:4px;padding:4px;
  background:#f4f5f4;border:1px solid #e8eae8;border-radius:12px;
}
.segmented button{
  min-height:36px;border:0;border-radius:9px;padding:9px 13px;
  background:transparent;color:#777d78;font-size:12px;line-height:1.2;font-weight:665;white-space:nowrap;
}
.segmented button:hover{background:#e8ece8}
.segmented button[aria-pressed=true]{
  color:#202321;background:white;box-shadow:0 1px 5px #26382b18;
}
.evening-tags{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 12px 67px}
.evening-tag{
  display:flex;align-items:center;justify-content:center;gap:9px;
  min-height:39px;background:#f7f8f7;border-radius:9px;
  font-size:12px;font-weight:650;color:#7a867c;
}
.evening-tag:before{content:"";display:block;flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#87aa93}
.evening-tag[data-track=wash]:before{background:#b1a0c9}
.task[data-track=both]{left:6px;right:6px}
.task[data-track=dry]{left:6px;right:auto;width:calc(50% - 9px)}
.task[data-track=wash]{left:auto;right:6px;width:calc(50% - 9px)}
.lane-divider{
  position:absolute;left:50%;top:calc(135 * var(--minute-size));
  height:calc(145 * var(--minute-size));z-index:1;
  border-left:1px dashed #d8ded8;pointer-events:none;
}
.evening-layout[data-view=dry] .task[data-track=wash],
.evening-layout[data-view=wash] .task[data-track=dry]{display:none}
.evening-layout[data-view=dry] .task[data-track=dry],
.evening-layout[data-view=wash] .task[data-track=wash]{left:6px;right:6px;width:auto}
.evening-layout[data-view=dry] .lane-divider,
.evening-layout[data-view=wash] .lane-divider{display:none}
.evening-layout[data-view=dry] .evening-tags,
.evening-layout[data-view=wash] .evening-tags{grid-template-columns:1fr}
.evening-layout[data-view=dry] .evening-tag[data-track=wash],
.evening-layout[data-view=wash] .evening-tag[data-track=dry]{display:none}
.light-note{
  display:inline-flex;align-items:center;gap:9px;margin:0;
  color:#818881;font-size:11px;line-height:1.3;
}
.light-note:before{content:"";width:19px;height:2px;background:var(--red);border-radius:2px}
.end{display:flex;align-items:center;gap:10px;margin:11px 0 0 67px;color:#466852;font-weight:675;font-size:12px}
.end .end-dot{display:block;width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--green)}
.end time{color:#818e83;font-variant-numeric:tabular-nums}
.now-line{
  position:absolute;left:-8px;right:-4px;z-index:30;
  display:none;height:2px;background:var(--red);pointer-events:none;
  box-shadow:0 0 5px #e1525b3d;
}
.now-line.visible{display:block}
.now-line:before{
  content:"";position:absolute;left:-5px;top:-5px;
  width:12px;height:12px;border-radius:50%;
  background:var(--red);border:3px solid white;outline:2px solid var(--red);
}
.now-flag{
  position:absolute;right:1px;top:-29px;
  background:var(--red);border-radius:7px;color:white;
  font-size:11px;line-height:1.2;font-weight:760;
  padding:7px 9px;white-space:nowrap;font-variant-numeric:tabular-nums;
}
.morning .task{border-radius:10px}
.morning .task-title{font-size:14px}
.morning .task.short .task-title{font-size:12px}
@media(max-width:760px){
 html{scroll-padding-top:95px}
 .page{width:calc(100% - 24px);padding:22px 0 44px}
 .top{gap:9px;padding-bottom:19px}
 .brand{gap:10px}
 .brandmark{width:39px;height:39px;flex-basis:39px;border-radius:12px}
 .brandmark svg{width:20px;height:20px}
 h1{font-size:25px;margin-bottom:5px}
 .kicker{font-size:9px}
 .date{font-size:11px}
 .clock-box{min-width:110px}
 .clock{font-size:19px}
 .now-activity{font-size:10px;max-width:135px}
 .nav{gap:6px;padding:8px;margin-bottom:14px;border-radius:13px}
 .nav button[data-nav]{flex:1;gap:6px;padding:9px 6px;min-height:40px;font-size:12px}
 .nav button[data-nav] svg{width:16px;height:16px;flex-basis:16px}
 .nav button[data-nav] small{display:none}
 .nav .spacer{flex-basis:100%;height:0}
 .nav .btn{flex:1;min-height:37px}
 .section{padding:20px 13px 22px;border-radius:17px}
 .section-header{margin-bottom:21px;gap:8px}
 .section-id{font-size:9px;margin-bottom:10px}
 .section-name{gap:8px}
 .section-name h2{font-size:20px}
 .section-emoji{width:31px;height:31px;flex-basis:31px;border-radius:10px}
 .section-emoji svg{width:18px;height:18px}
 .section-subtitle{font-size:11px;margin-top:9px}
 .section-range{font-size:10px;padding:9px 7px}
 .rail{flex-basis:50px;width:50px}
 .tick{right:7px;font-size:9px}
 .section-note{margin-left:50px;font-size:10px}
 .task{padding:7px 32px 7px 9px;border-radius:8px}
 .task.long{padding-top:13px}
 .task-title{gap:6px;font-size:12px}
 .task-icon{width:19px;height:19px;flex-basis:19px;font-size:11px;border-radius:6px}
 .task-time{margin-left:25px;font-size:10px}
 .task-desc{margin-left:25px;font-size:10px}
 .morning .task-title{font-size:13px}
 .task.short{padding:1px 28px 1px 8px}
 .task.short .task-title{font-size:11px}
 .task.short .task-time{display:none}
 .color{width:20px;height:20px;top:8px;right:7px;border-width:2px}
 .task.short .color{width:17px;height:17px;right:5px}
 .task.afternoon{padding:14px 9px 8px 11px}
 .task.afternoon .task-title{padding-right:25px}
 .task.afternoon .task-time{margin-left:25px}
 .pill-reminder{font-size:11px;padding:9px;margin-top:10px}
 .reminder-label{margin-left:25px;font-size:10px}
 .reminder-row{left:8px;right:8px;grid-template-columns:18px minmax(0,108px) minmax(0,1fr);gap:7px;min-height:42px;padding:6px 7px;border-radius:8px}
 .reminder-row input[type=time]{width:100%;max-width:100%;padding:3px 5px;font-size:11px}
 .rem-title{font-size:11px;gap:6px}
 .rem-icon{display:none}
 .evening-tools{gap:8px}
 .segmented{width:100%}
 .segmented button{flex:1;padding:9px 5px;font-size:11px}
 .segmented button[data-view=compare]{display:none}
 .evening-tags{margin-left:50px}
 .evening-tag{font-size:11px;min-height:36px}
 .end{margin-left:50px;font-size:11px}
 .light-note{font-size:10px}
 .evening-layout[data-view=compare] .task[data-track=dry],
 .evening-layout[data-view=compare] .task[data-track=wash]{padding:6px 22px 6px 8px}
}
@media(max-width:420px){
 .page{width:calc(100% - 18px)}
 .brandmark{width:36px;height:36px;flex-basis:36px}
 h1{font-size:22px}
 .clock{font-size:17px}
 .clock-box{min-width:97px}
 .section-header{flex-wrap:wrap}
 .section-range{margin-left:39px}
 .reminder-row{grid-template-columns:16px minmax(0,100px) minmax(0,1fr);gap:6px;padding:6px}
 .reminder-row input[type=time]{width:100%;max-width:100%;font-size:10px;padding:3px}
 .rem-title{font-size:10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* Small alignment and clipping refinements */
.rail-layout{align-items:flex-start}
.plot,.rail{min-height:0;box-sizing:border-box}
.task{box-sizing:border-box}
.task-title,.task-time,.task-desc{min-width:0}
.task.short{min-height:0}
.reminder-row{box-sizing:border-box}
.reminder-row input[type=time]{box-sizing:border-box;overflow:hidden}
.reminder-row input[type=time]::-webkit-datetime-edit{padding:0;white-space:nowrap}
.reminder-row input[type=time]::-webkit-calendar-picker-indicator{
  margin:0;padding:0;flex:0 0 16px;width:16px;height:16px;opacity:.65
}
@media(max-width:760px){
 .reminder-row .rem-title{min-width:0;line-height:1.35}
 .reminder-row .rem-text{overflow-wrap:anywhere}
 .task.short .task-time{display:none}
}

</style>
</head>
<body>
<div class="page">
<header class="top">
  <div class="brand"><div class="brandmark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div>
    <p class="kicker">DAILY ROUTINE</p><h1>每日时间表</h1>
    <div class="date" id="todayDate">正在读取日期…</div>
  </div></div>
  <div class="clock-box"><div class="clock" id="clock">--:--:--</div><div class="now-activity" id="currentActivity">正在读取时间…</div></div>
</header>
<nav class="nav" aria-label="三个时间段">
 <button type="button" data-nav="morning" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2M3.9 5.9l1.4 1.4M2 12h2M20 12h2M18.7 7.3l1.4-1.4"/><path d="M3 17h18M5 21h14"/><path d="M7 17a5 5 0 0 1 10 0"/></svg><span>早间</span> <small>07:50—09:00</small></button>
 <button type="button" data-nav="day" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18M10 13v2h4v-2"/></svg><span>白天</span> <small>09:00—18:00</small></button>
 <button type="button" data-nav="evening" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><span>晚上</span> <small>18:00—23:30</small></button>
 <span class="spacer"></span>
 <button class="btn" type="button" id="goNow"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>定位当前</span></button>
 <button class="btn" type="button" id="resetColors"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>重置配色</span></button>
</nav>
<main>
<section class="section morning" id="morning" aria-labelledby="morningTitle">
 <div class="section-header"><div>
  <div class="section-id">01 / MORNING</div>
  <div class="section-name"><span class="section-emoji"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2M3.9 5.9l1.4 1.4M2 12h2M20 12h2M18.7 7.3l1.4-1.4"/><path d="M3 17h18M5 21h14"/><path d="M7 17a5 5 0 0 1 10 0"/></svg></span><h2 id="morningTitle">早间 · 起床出门</h2></div>
  <p class="section-subtitle">起床、洗漱、护肤、早餐，再出发上班。</p>
 </div><div class="section-range">07:50 — 09:00</div></div>
 <div class="rail-layout" id="morningLayout">
  <div class="rail" id="morningRail" style="--minutes:70;--minute-size:4.9px" aria-hidden="true"></div>
  <div class="plot" id="morningPlot" style="--minutes:70;--minute-size:4.9px" aria-label="早间按分钟比例展示的时间表">
   <div class="now-line" id="morningLine" aria-hidden="true"><span class="now-flag">--:--</span></div>
  </div>
 </div>
</section>
<section class="section" id="day" aria-labelledby="dayTitle" hidden>
 <div class="section-header"><div>
  <div class="section-id">02 / DAYTIME</div>
  <div class="section-name"><span class="section-emoji"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18M10 13v2h4v-2"/></svg></span><h2 id="dayTitle">白天 · 工作与休息</h2></div>
  <p class="section-subtitle">上午专注工作，午间休息；下午记得照顾好自己。</p>
 </div><div class="section-range">09:00 — 18:00</div></div>
 <div class="rail-layout" id="dayLayout">
  <div class="rail" id="dayRail" style="--minutes:540;--minute-size:2px" aria-hidden="true"></div>
  <div class="plot" id="dayPlot" style="--minutes:540;--minute-size:2px" aria-label="白天按分钟比例展示的时间表">
   <div class="now-line" id="dayLine" aria-hidden="true"><span class="now-flag">--:--</span></div>
  </div>
 </div>
</section>
<section class="section" id="evening" aria-labelledby="eveningTitle" hidden>
 <div class="section-header"><div>
  <div class="section-id">03 / EVENING</div>
  <div class="section-name"><span class="section-emoji"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></span><h2 id="eveningTitle">晚上 · 慢慢放松</h2></div>
  <p class="section-subtitle">从下班回家，到 23:30 关灯准备入睡。</p>
 </div><div class="section-range">18:00 — 23:30</div></div>
 <div class="evening-layout" id="eveningLayout" data-view="compare">
  <div class="evening-tools">
   <div class="segmented" role="group" aria-label="选择晚间作息">
    <button type="button" data-view="compare" aria-pressed="true">两种安排对比</button>
    <button type="button" data-view="dry" aria-pressed="false">不洗头</button>
    <button type="button" data-view="wash" aria-pressed="false">洗头</button>
   </div>
   <span class="light-note">红线表示当前时间</span>
  </div>
  <div class="evening-tags" aria-hidden="true">
    <div class="evening-tag" data-track="dry">不洗头的晚上</div>
    <div class="evening-tag" data-track="wash">洗头的晚上</div>
  </div>
  <div class="rail-layout">
    <div class="rail" id="eveningRail" style="--minutes:330;--minute-size:3.3px" aria-hidden="true"></div>
    <div class="plot" id="eveningPlot" style="--minutes:330;--minute-size:3.3px" aria-label="晚间按分钟比例展示的时间表">
      <div class="lane-divider" aria-hidden="true"></div>
      <div class="now-line" id="eveningLine" aria-hidden="true"><span class="now-flag">--:--</span></div>
    </div>
  </div>
  <div class="end"><span class="end-dot"></span><time>23:30</time><span>关灯，准备入睡</span></div>
 </div>
</section>
</main></div>
<script>
"use strict";
const SLICES = {
 morning:{start:470,end:540,plot:"morningPlot",rail:"morningRail",line:"morningLine",size:4.9,ticks:[470,480,495,510,525,540]},
 day:{start:540,end:1080,plot:"dayPlot",rail:"dayRail",line:"dayLine",size:2,ticks:[540,600,660,705,720,780,840,900,960,1020,1080]},
 evening:{start:1080,end:1410,plot:"eveningPlot",rail:"eveningRail",line:"eveningLine",size:3.3,ticks:Array.from({length:12},(_,i)=>1080+i*30)}
};
const ITEMS = [
 {id:"wake",s:"morning",start:"07:50",end:"08:00",title:"起床",icon:"🛏️",color:"#dfe8ff"},
 {id:"wash-am",s:"morning",start:"08:00",end:"08:15",title:"洗漱",icon:"💧",color:"#e6e9ff"},
 {id:"skin",s:"morning",start:"08:15",end:"08:30",title:"护肤、穿衣",icon:"🧴",color:"#fce3e4"},
 {id:"breakfast-am",s:"morning",start:"08:30",end:"08:45",title:"早餐",icon:"🥐",color:"#ffead2"},
 {id:"to-work",s:"morning",start:"08:45",end:"09:00",title:"去上班",icon:"🚶",color:"#daf2da"},
 {id:"work-am",s:"day",start:"09:00",end:"11:45",title:"上午工作",icon:"💻",desc:"专注处理上午的工作任务",color:"#e1ebff",kind:"am"},
 {id:"lunch-day",s:"day",start:"11:45",end:"13:00",title:"午饭与午间休息",icon:"🍱",color:"#fff0d5"},
 {id:"work-pm",s:"day",start:"13:00",end:"18:00",title:"下午工作",icon:"🗂️",color:"#e1f2e3",kind:"pm"},
 {id:"commute",s:"evening",track:"both",start:"18:00",end:"18:20",title:"下班、回家",icon:"🚶",color:"#dcebdd"},
 {id:"settle",s:"evening",track:"both",start:"18:20",end:"18:30",title:"到家、换衣服，歇一会儿",icon:"🧥",color:"#e5e9f3"},
 {id:"cook",s:"evening",track:"both",start:"18:30",end:"19:10",title:"做晚饭",icon:"🍳",color:"#ffe0b7"},
 {id:"dinner",s:"evening",track:"both",start:"19:10",end:"19:35",title:"吃饭",icon:"🍚",color:"#ffeacc"},
 {id:"dishes",s:"evening",track:"both",start:"19:35",end:"19:45",title:"洗碗、简单收拾厨房",icon:"🧽",color:"#e0edf0"},
 {id:"walk",s:"evening",track:"both",start:"19:45",end:"20:15",title:"出门轻松散步",icon:"🌿",color:"#d5ecdf"},
 {id:"dry-shower",s:"evening",track:"dry",start:"20:15",end:"20:40",title:"洗澡、护肤",icon:"🚿",color:"#e6e4f6"},
 {id:"wash-shower",s:"evening",track:"wash",start:"20:15",end:"20:40",title:"洗澡、洗头",icon:"🚿",color:"#dfe8f7"},
 {id:"dry-free",s:"evening",track:"dry",start:"20:40",end:"22:40",title:"自由时间：看书或看影视",icon:"📖",color:"#e9e4f6"},
 {id:"wash-hair",s:"evening",track:"wash",start:"20:40",end:"21:15",title:"吸水、吹头发、护肤",icon:"🪮",color:"#f8e1e6"},
 {id:"wash-free",s:"evening",track:"wash",start:"21:15",end:"22:40",title:"看书、看一集剧",icon:"🎬",color:"#ece7f7"},
 {id:"footbath",s:"evening",track:"both",start:"22:40",end:"22:55",title:"泡脚 + 听音乐（含准备和收拾）",icon:"🎵",color:"#fbe9d6"},
 {id:"recovery",s:"evening",track:"both",start:"22:55",end:"23:10",title:"在床上坐着做已有的康复动作",icon:"🧘",color:"#deecdf"},
 {id:"winddown",s:"evening",track:"both",start:"23:10",end:"23:30",title:"刷牙、上厕所、调暗灯光，安静下来",icon:"🌙",color:"#e4e8ed"}
];
const REMINDERS = [
 {id:"coffee",at:"14:30",name:"☕ 喝咖啡"},
 {id:"fruit",at:"15:30",name:"🍎 吃水果"},
 {id:"stretch",at:"16:30",name:"🚶 站起来走走"},
 {id:"wrap",at:"17:30",name:"📋 总结当日工作、安排明天与今晚晚饭"}
];
const $=id=>document.getElementById(id);
const toMin=t=>{const a=t.split(":").map(Number);return a[0]*60+a[1]};
const pad=n=>String(n).padStart(2,"0");
const format=m=>pad(Math.floor(m/60))+":"+pad(Math.floor(m%60));
const saved=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const persist=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const del=k=>{try{localStorage.removeItem(k)}catch(e){}};
const taskEls=new Map();
const remindEls=new Map();
let eveningView=window.innerWidth<=760?"dry":"compare";
let currentDateKey="";
let selectedSection=null;
function ink(hex){
 const a=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));
 return (a[0]*.2126+a[1]*.7152+a[2]*.0722)<.39?"#fff":"#26362e";
}
function paint(el,color){el.style.setProperty("--task-bg",color);el.style.setProperty("--task-ink",ink(color))}
function tick(section){
 const s=SLICES[section],rail=$(s.rail),plot=$(s.plot);
 s.ticks.forEach(m=>{
  const y=(m-s.start)*s.size;
  const label=document.createElement("span");
  label.className="tick"+(m%60===0||m===s.start?" major":"");
  label.style.top=y+"px";label.textContent=format(m);rail.appendChild(label);
  const div=document.createElement("div");
  div.className="gridline"+(m%60===0?" major":"");
  div.style.top=y+"px";plot.appendChild(div);
 });
}
function addTask(x){
 const section=SLICES[x.s],duration=toMin(x.end)-toMin(x.start),el=document.createElement("article");
 el.className="task"+(duration<=15?" short":duration>=80?" long":"")+(x.kind==="pm"?" afternoon":"");
 if(x.track)el.dataset.track=x.track;
 el.dataset.id=x.id;
 el.setAttribute("aria-label",x.title+"，"+x.start+" 到 "+x.end);
 el.title=x.title+" · "+x.start+"—"+x.end;
 el.style.top="calc("+((toMin(x.start)-section.start))+" * var(--minute-size) + 2px)";
 el.style.height="calc("+(duration)+" * var(--minute-size) - 4px)";
 const title=document.createElement("div");title.className="task-title";
 const icon=document.createElement("span");icon.className="task-icon";icon.setAttribute("aria-hidden","true");icon.textContent=x.icon;
 const name=document.createElement("span");name.textContent=x.title;title.append(icon,name);el.appendChild(title);
 const time=document.createElement("div");time.className="task-time";time.textContent=x.start+" — "+x.end;el.appendChild(time);
 if(x.desc){const desc=document.createElement("div");desc.className="task-desc";desc.textContent=x.desc;el.appendChild(desc)}
 if(x.kind==="am"){
  const remind=document.createElement("div");remind.className="pill-reminder";
  const body=document.createElement("div");
  body.textContent="💊 上午提醒：专注药";
  const sub=document.createElement("small");sub.textContent="按你已有的医嘱和服药时间安排";
  body.appendChild(sub);remind.appendChild(body);el.appendChild(remind);
 }
 if(x.kind==="pm"){
  const hint=document.createElement("div");hint.className="reminder-label";hint.textContent="今日的小提醒 · 时间可以修改";el.appendChild(hint);
 }
 const pick=document.createElement("input");pick.type="color";pick.className="color";pick.title="更改「"+x.title+"」背景色";pick.setAttribute("aria-label",pick.title);
 const key=(x.s==="evening"?"evening-color-":"daily-color-")+x.id;
 const value=saved(key)||x.color;
 pick.value=/^#[0-9a-fA-F]{6}$/.test(value)?value:x.color;
 paint(el,pick.value);
 pick.addEventListener("input",()=>{paint(el,pick.value);persist(key,pick.value)});
 el.appendChild(pick);
 $(section.plot).appendChild(el);
 taskEls.set(x.id,el);
}
function todayKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addReminders(){
 const parent=taskEls.get("work-pm");
 REMINDERS.forEach(r=>{
  const row=document.createElement("div");row.className="reminder-row";
  const check=document.createElement("input");check.type="checkbox";check.setAttribute("aria-label","完成："+r.name);
  const time=document.createElement("input");time.type="time";time.setAttribute("aria-label","调整"+r.name+"的提醒时间");
  time.value=saved("daily-time-"+r.id)||r.at;
  const title=document.createElement("span");title.className="rem-title";
  const icon=document.createElement("span");icon.className="rem-icon";icon.setAttribute("aria-hidden","true");
  const label=document.createElement("span");label.className="rem-text";
  const splitAt=r.name.indexOf(" ");
  icon.textContent=r.name.slice(0,splitAt);label.textContent=r.name.slice(splitAt+1);
  title.append(icon,label);
  row.append(check,time,title);
  check.addEventListener("change",()=>{persist("daily-done-"+todayKey(new Date())+"-"+r.id,check.checked?"1":"0");row.classList.toggle("done",check.checked)});
  time.addEventListener("change",()=>{
   const at=toMin(time.value||r.at);
   if(at<13*60||at>=18*60){time.value=r.at;persist("daily-time-"+r.id,r.at)}
   else persist("daily-time-"+r.id,time.value);
   positionReminder(row,time.value);
   updateClock();
  });
  parent.appendChild(row);
  positionReminder(row,time.value);
  remindEls.set(r.id,{row,check,time});
 });
}
function positionReminder(row,t){
 const offset=Math.max(0,Math.min(280,toMin(t)-13*60));
 row.style.top="calc("+offset+" * var(--minute-size) - 2px)";
}
function changeView(view){
 eveningView=view;
 $("eveningLayout").dataset.view=view;
 document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===view)));
 updateClock();
}
function getStage(min){
 if(min>=470&&min<540)return "morning";
 if(min>=540&&min<1080)return "day";
 if(min>=1080&&min<=1410)return "evening";
 return null;
}
function showSection(name,scroll=false,remember=false){
 if(!SLICES[name])return;
 selectedSection=name;
 Object.keys(SLICES).forEach(id=>{
  $(id).hidden=id!==name;
  const tab=document.querySelector('[data-nav="'+id+'"]');
  tab.classList.toggle("is-current",id===name);
  tab.setAttribute("aria-pressed",String(id===name));
 });
 if(remember)persist("daily-selected-tab",name);
 if(scroll)window.scrollTo({top:0,behavior:"smooth"});
}
function activeTask(min){
 const section=getStage(min);
 if(!section)return "";
 const a=ITEMS.filter(x=>x.s===section&&toMin(x.start)<=min&&toMin(x.end)>min
 &&(section!=="evening"||eveningView==="compare"||x.track==="both"||x.track===eveningView));
 if(a.length===0)return "";
 if(a.length===2)return "不洗头："+a[0].title+" · 洗头："+a[1].title;
 return a[0].title;
}
function updateClock(){
 const d=new Date(),min=d.getHours()*60+d.getMinutes()+d.getSeconds()/60,stage=getStage(min),key=todayKey(d);
 $("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
 if(key!==currentDateKey){
  $("todayDate").textContent=new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(d);
  currentDateKey=key;
  remindEls.forEach((z,id)=>{z.check.checked=saved("daily-done-"+key+"-"+id)==="1";z.row.classList.toggle("done",z.check.checked)});
 }
 for(const [name,s] of Object.entries(SLICES)){
  const line=$(s.line),isHere=stage===name;
  line.classList.toggle("visible",isHere);
  if(isHere){line.style.top=((min-s.start)*s.size)+"px";line.querySelector(".now-flag").textContent=format(min)}
 }
 const active=activeTask(min);
 $("currentActivity").textContent=active?("现在 · "+active):min<470?"今天的计划将在 07:50 开始":"今日安排已结束 · 好好休息";
 for(const x of ITEMS){
  const el=taskEls.get(x.id);
  if(el)el.classList.toggle("active",x.s===stage&&min>=toMin(x.start)&&min<toMin(x.end));
 }
 remindEls.forEach(z=>{
  const at=toMin(z.time.value);
  z.row.classList.toggle("due",stage==="day"&&min>=at&&min<at+15&&!z.check.checked);
 });
}
function resetColors(){
 ITEMS.forEach(x=>{
  const key=(x.s==="evening"?"evening-color-":"daily-color-")+x.id;
  del(key);
  const el=taskEls.get(x.id);
  if(el){paint(el,x.color);el.querySelector(".color").value=x.color}
 });
}
function jumpNow(){
 const now=new Date(),min=now.getHours()*60+now.getMinutes(),stage=getStage(min)||(min<470?"morning":"evening");
 showSection(stage,false,true);
 updateClock();
 const target=$(SLICES[stage].line);
 if(stage===getStage(min)&&target.classList.contains("visible"))target.scrollIntoView({behavior:"smooth",block:"center"});
 else window.scrollTo({top:0,behavior:"smooth"});
}
function init(){
 Object.keys(SLICES).forEach(tick);
 ITEMS.forEach(addTask);
 addReminders();
 const initialMinutes=new Date().getHours()*60+new Date().getMinutes();
 const initialStage=getStage(initialMinutes)||(initialMinutes<470?"morning":"evening");
 showSection(["morning","day","evening"].includes(saved("daily-selected-tab"))?saved("daily-selected-tab"):initialStage);
 document.querySelectorAll("[data-nav]").forEach(tab=>tab.addEventListener("click",()=>showSection(tab.dataset.nav,true,true)));
 document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>changeView(b.dataset.view)));
 $("resetColors").addEventListener("click",resetColors);
 $("goNow").addEventListener("click",jumpNow);
 changeView(eveningView);
 setInterval(updateClock,1000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)updateClock()});
}
init();
</script>
</body>
</html>
